<!doctype html><html lang="en"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box}body{margin:0;font:13px/1.5 var(--font-sans,system-ui);color:var(--foreground,#f5f5f5);background:transparent}.controls{border:0;padding:0;margin:0;min-width:0;display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}button{font:inherit;font-size:12px;padding:5px 9px;border:1px solid var(--border,#242424);border-radius:6px;background:transparent;color:var(--muted-foreground,#818181);cursor:pointer}button[aria-pressed=true]{color:var(--foreground,#f5f5f5);background:var(--secondary,#1e1e1e)}.shot{width:100%;max-width:540px;margin:0 auto;overflow:hidden;border:1px solid #191919;border-radius:8px;background:#0a0a0a}.shot img{width:266.666667%;max-width:none;margin-left:-166.666667%;display:block}.shot.phone{max-width:390px}.shot.phone img{width:100%;margin-left:0}.caption{font-size:12px;color:var(--muted-foreground,#818181);margin:12px 0 0}.facts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}.facts span{font:11px var(--font-mono,monospace);padding:4px 7px;border:1px solid var(--border,#242424);border-radius:5px}
</style></head><body><fieldset class="controls" aria-label="Implementation screenshots">
<button type="button" aria-pressed="true" data-src="assets/t3-right-panel/nap-right-panel-diff.png">Git changes</button><button type="button" aria-pressed="false" data-src="assets/t3-right-panel/nap-right-panel-pr.png">PR summary</button><button type="button" aria-pressed="false" data-src="assets/t3-right-panel/nap-right-panel-pr-code.png">PR code</button><button type="button" aria-pressed="false" data-src="assets/t3-right-panel/nap-right-panel-file.png">File</button><button type="button" aria-pressed="false" data-src="assets/t3-right-panel/nap-right-panel-browser.png">Browser</button><button type="button" aria-pressed="false" data-phone="true" data-src="assets/t3-right-panel/nap-right-panel-mobile.png">Phone</button>
</fieldset><div class="facts"><span>540px panel</span><span>52px header</span><span>24px tabs</span><span>#0a0a0a canvas</span><span>Pierre 1.5.2</span></div>
<div class="shot"><img src="assets/t3-right-panel/nap-right-panel-diff.png" alt="Implemented Nap right panel showing a syntax-highlighted Git diff"></div><p class="caption">Actual Nap components, captured with local test data. Tabs, resizing, persistence, preview state, and responsive layout were exercised in a browser.</p><script>for(const button of document.querySelectorAll('button'))button.onclick=()=>{for(const item of document.querySelectorAll('button'))item.setAttribute('aria-pressed',String(item===button));const shot=document.querySelector('.shot');shot.classList.toggle('phone',button.dataset.phone==='true');const img=shot.querySelector('img');img.src=button.dataset.src;img.alt=`Implemented Nap right panel: ${button.textContent}`;};</script></body></html>
