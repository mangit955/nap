<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit — board</title>
    <style>
      /* No media query anywhere, and a hard minimum width. At 1280 this is an ordinary three
         column board; at 375 it is the same board, scrolled off the right-hand edge.

         The markup is identical to `responsive-strong` — same header, same three columns, same
         five cards — and the two stylesheets differ only in whether the small viewport was
         designed for. A pair that also differed in content would let a judge grade the difference
         rather than the responsiveness. */
      * { box-sizing: border-box; }
      body {
        margin: 0; background: #f6f7f9; color: #16181d; min-width: 1180px;
        font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .shell { width: 1180px; margin: 0 auto; padding: 36px 32px 64px; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; }
      .sub { color: #6b7280; font-size: 13px; margin: 5px 0 0; }
      form { display: flex; gap: 10px; }
      input { width: 340px; padding: 9px 12px; font: inherit; font-size: 14px; border: 1px solid #dfe3e8; border-radius: 6px; background: #fff; }
      button { padding: 9px 18px; font: inherit; font-size: 14px; font-weight: 500; color: #fff; background: #2f45c5; border: 1px solid #2f45c5; border-radius: 6px; cursor: pointer; }

      .board { display: flex; gap: 20px; }
      .column { width: 372px; flex: none; background: #fff; border: 1px solid #e6e8ec; border-radius: 10px; padding: 16px; }
      .column h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #6b7280; }
      .card { border: 1px solid #e6e8ec; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
      .card:last-child { margin-bottom: 0; }
      .card .title { display: block; margin-bottom: 6px; }
      .card .who { color: #6b7280; font-size: 13px; }
      .empty { color: #9aa1ab; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <h1>Board</h1>
          <p class="sub">Orbit — week of 18 August · 5 items</p>
        </div>
        <form onsubmit="return false">
          <input placeholder="Add a task" aria-label="Add a task" />
          <button type="submit">Add</button>
        </form>
      </header>

      <div class="board">
        <section class="column">
          <h2>Todo</h2>
          <div class="card"><span class="title">Review the pricing copy</span><span class="who">Alex</span></div>
        </section>
        <section class="column">
          <h2>In progress</h2>
          <div class="card"><span class="title">Draft the Q3 rollout plan</span><span class="who">Priya</span></div>
          <div class="card"><span class="title">Fix the sign-in redirect loop</span><span class="who">Sam</span></div>
          <div class="card"><span class="title">Migrate the staging database</span><span class="who">Priya · blocked</span></div>
        </section>
        <section class="column">
          <h2>Done</h2>
          <div class="card"><span class="title">Ship the onboarding email</span><span class="who">Sam</span></div>
          <p class="empty">Nothing else finished this week.</p>
        </section>
      </div>
    </div>
  </body>
</html>
