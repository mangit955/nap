name: Benchmark

# Runs one locked Terminal-Bench task set against Nap's agent and uploads the report. Manual only:
# a run can spend money, and nothing about a push says it should. harbor/README.md, "Scoring a task
# set", says what each input does and what a run leaves behind.
on:
  # TEMPORARY, for runs before the workflow is on main. Never merged.
  push:
    branches: [tmp/benchmark-dry-run]
  workflow_dispatch:
    inputs:
      set:
        description: "Locked task set (harbor/task-sets): dev to try a change, test for a reported score"
        type: choice
        options: [dev, test]
        default: dev
      model:
        description: "OpenRouter model id. Anything without :free costs money and needs spend"
        type: string
        default: nvidia/nemotron-3-ultra-550b-a55b:free
      spend:
        description: "Allow a model that is not free. Costs money"
        type: boolean
        default: false
      concurrency:
        description: "Trials at once. A free model is held to 2: its quota is about 20 requests a minute"
        type: number
        default: 2
      scripted:
        description: "Wiring check: a scripted model, no key, no spend; the score means nothing"
        type: boolean
        default: false

permissions:
  contents: read

# One at a time: two runs would share one key's quota and one budget.
concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  terminal-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SET: ${{ inputs.set || 'test' }}
      MODEL: ${{ inputs.model || 'openai/gpt-6-luna' }}
      SPEND: ${{ inputs.spend || 'true' }}
      CONCURRENCY: ${{ inputs.concurrency || '4' }}
      SCRIPTED: ${{ inputs.scripted || 'false' }}
      JOB_NAME: ${{ inputs.set || 'test' }}-${{ github.run_id }}
    steps:
      # Inputs arrive as environment variables, never spliced into a script, and are checked
      # before anything is installed: a model that costs money without spend set would otherwise
      # fail every trial an hour later, one by one.
      - name: Check the inputs
        run: |
          if ! [[ "$MODEL" =~ ^[a-z0-9._-]+/[a-z0-9._-]+(:free)?$ ]]; then
            echo "::error::model must be an OpenRouter id such as openai/gpt-6-luna"; exit 1
          fi
          if ! [[ "$CONCURRENCY" =~ ^[1-4]$ ]]; then
            echo "::error::concurrency must be 1 to 4: the runner has four cores"; exit 1
          fi
          free=false; [[ "$MODEL" == *:free ]] && free=true
          if [[ "$SCRIPTED" != true && "$free" != true && "$SPEND" != true ]]; then
            echo "::error::$MODEL costs money: set spend to run it"; exit 1
          fi
          if [[ "$SCRIPTED" != true && "$free" == true && "$CONCURRENCY" -gt 2 ]]; then
            echo "::error::a free model is held to concurrency 2 by its quota of about 20 requests a minute"; exit 1
          fi

      - uses: actions/checkout@v7

      # Task images run to several gigabytes each; the runner's preinstalled toolchains are
      # space Harbor needs more.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"

      # Harbor's output goes to a file in the artifact, to keep this log short. The artifact is as
      # public as the log: the repository is.
      - name: Run the task set
        env:
          OPENROUTER_API_KEY: ${{ secrets.BENCHMARK_OPENROUTER_API_KEY }}
        run: |
          flags=""
          if [[ "$SCRIPTED" == true ]]; then flags="--scripted"; elif [[ "$SPEND" == true ]]; then flags="--spend"; fi
          if [[ "$SCRIPTED" != true && -z "$OPENROUTER_API_KEY" ]]; then
            echo "::error::the BENCHMARK_OPENROUTER_API_KEY secret is not set"; exit 1
          fi
          # A failure inside $(...) does not stop the step: an empty list here would let Harbor
          # run the whole dataset under this set's name, so it is refused rather than passed on.
          read -ra include <<< "$(uv run --directory harbor python -m nap_harbor.task_sets "$SET")"
          if (( ${#include[@]} == 0 )); then
            echo "::error::could not read the $SET task set"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/jobs"
          NAP_HARBOR_FLAGS="$flags" uv run --directory harbor --extra harbor harbor run \
            -d terminal-bench/terminal-bench-2-1 "${include[@]}" \
            -a nap_harbor.agent:NapAgent -m "$MODEL" \
            -n "$CONCURRENCY" -o "$RUNNER_TEMP/jobs" --job-name "$JOB_NAME" -q -y \
            > "$RUNNER_TEMP/jobs/harbor.log" 2>&1 || status=$?
          echo "harbor exited ${status:-0}"
          exit "${status:-0}"

      - name: Write the report
        if: always()
        run: bun run packages/runtime/scripts/harbor-report.ts "$RUNNER_TEMP/jobs/$JOB_NAME"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: terminal-bench-${{ env.JOB_NAME }}
          path: ${{ runner.temp }}/jobs
          retention-days: 90
