# The shape of `secret/nap-secrets`, with every value left empty on purpose.
#
# **This file is not applied and is not in `kustomization.yaml`.** It is the list of what the three
# deployments expect to find, so that a missing key is a thing you can read rather than a boot
# failure to decode — and it holds no value, so committing it commits nothing. Filling it in and
# applying it would put every credential this deployment has into git history, where deleting it
# later does not remove it.
#
# Create the real one out of band, from a secret manager or by hand:
#
#   kubectl -n nap create secret generic nap-secrets \
#     --from-literal=DATABASE_URL='postgres://…' \
#     --from-literal=E2B_API_KEY='…' \
#     --from-literal=OPENROUTER_API_KEY='sk-or-…' \
#     --from-literal=BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=NAP_KEY_ENCRYPTION_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=R2_ACCOUNT_ID='…' --from-literal=R2_BUCKET='…' \
#     --from-literal=R2_ACCESS_KEY_ID='…' --from-literal=R2_SECRET_ACCESS_KEY='…'
#
# Two of these are worth saying out loud. `NAP_KEY_ENCRYPTION_SECRET` must decode to exactly 32
# bytes or boot refuses, and rotating it is not corruption: every API key a user brought simply
# stops opening and they paste it again. `NAP_LISTEN_DATABASE_URL` is only needed behind a
# connection pooler, and there it is not optional — LISTEN and the reaper's advisory lock are both
# session state, and a transaction pooler hands the next statement to whichever backend is free, so
# the process hears nothing while every query it runs keeps working.
apiVersion: v1
kind: Secret
metadata:
  name: nap-secrets
  namespace: nap
  labels:
    app.kubernetes.io/name: nap
type: Opaque
stringData:
  DATABASE_URL: ""
  # Only behind a pooler; the direct endpoint. Omit the key entirely otherwise — an empty string
  # is not an unset variable, and Zod fails boot on `expected string to have >=1 characters`.
  # NAP_LISTEN_DATABASE_URL: ""
  E2B_API_KEY: ""
  OPENROUTER_API_KEY: ""
  BETTER_AUTH_SECRET: ""
  NAP_KEY_ENCRYPTION_SECRET: ""
  R2_ACCOUNT_ID: ""
  R2_BUCKET: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
