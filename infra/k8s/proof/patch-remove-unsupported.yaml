# Three of the base's objects are removed here rather than never written, because they are real
# parts of the deployment that this cluster cannot run: KEDA's CRDs are not installed, the HPA's
# custom metric needs Prometheus and an adapter, and kind's default CNI enforces no NetworkPolicy.
#
# Deleting them is the honest option. An overlay that applied a policy nothing enforces would look
# like it had been exercised when it had not.
$patch: delete
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nap-worker
  namespace: nap
---
$patch: delete
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: nap-postgres
  namespace: nap
---
$patch: delete
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nap-api
  namespace: nap
---
$patch: delete
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nap
  namespace: nap
