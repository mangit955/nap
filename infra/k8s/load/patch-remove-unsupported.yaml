# One object is removed here, and it is one fewer than the proof removes.
#
# kind's default CNI enforces no NetworkPolicy, so applying it would look exercised when it had
# not been. The ScaledObject and the HPA — which the proof also deletes — are kept, because they
# are the two things this overlay exists to run: `run.sh` installs KEDA and metrics-server so
# that both have something to read.
$patch: delete
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nap
  namespace: nap
