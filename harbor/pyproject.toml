[project]
name = "napbench-harbor"
version = "0.1.0"
description = "Nap's benchmark as a Harbor agent: it orchestrates trials and scores nothing."
requires-python = ">=3.12"
# Harbor itself is not a dependency of the package's *tested* half on purpose: everything a
# test drives lives in `trial.py`, which imports nothing but the standard library, so the
# suite runs on a checkout with no evaluation framework installed. `agent.py` is the thin
# part that needs it, and `[project.optional-dependencies]` is where that is asked for.
dependencies = []

[project.optional-dependencies]
harbor = ["harbor>=0.22,<0.23"]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["napbench_harbor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
